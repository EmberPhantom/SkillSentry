version = 1

[sources]
env_name_patterns = [
    "(?i)(token|secret|password|passwd|api[_-]?key|access[_-]?key|credential|private[_-]?key)"
]
path_globs = [
    "~/.aws/*",
    "~/.ssh/*",
    "~/.config/gcloud/*",
    "~/.netrc",
    "~/.docker/config.json",
    "~/.npmrc",
    "~/.pypirc",
    "~/.kube/config",
    "**/.env",
    "~/.git-credentials"
]

[sinks]
python_calls = [
    "requests.post",
    "requests.put",
    "requests.patch",
    "requests.get",
    "requests.request",
    "httpx.post",
    "httpx.put",
    "httpx.get",
    "httpx.request",
    "urllib.request.urlopen",
    "urllib.request.Request",
    "http.client.HTTPSConnection",
    "http.client.HTTPConnection",
    "socket.gethostbyname",
    "socket.getaddrinfo",
    "socket.create_connection"
]
js_patterns = [
    "fetch\\(",
    "axios\\.",
    "XMLHttpRequest",
    "https?\\.request\\("
]
shell_patterns = [
    "curl\\s",
    "wget\\s",
    "nc\\s",
    "dig\\s",
    "nslookup\\s"
]


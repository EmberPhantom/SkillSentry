name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-contract:
    name: Lint + contract tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check skill_sentry_cli tests scripts

      - name: Ruff format
        run: ruff format --check skill_sentry_cli tests scripts

      - name: Type check (mypy)
        run: mypy

      - name: Unit + contract tests
        if: matrix.python-version != '3.12'
        run: pytest tests/unit tests/contract -q

      - name: Unit + contract tests with coverage gate
        # One leg measures coverage; the threshold lives in [tool.coverage.report].
        if: matrix.python-version == '3.12'
        run: pytest tests/unit tests/contract -q --cov=skill_sentry_cli

      - name: Schema export is reproducible
        run: |
          python scripts/export_schema.py
          git diff --exit-code -- schemas/
          test -z "$(git status --porcelain -- schemas/)"

  demo-smoke:
    name: Demo server smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Boot demo server
        run: |
          python -m skill_sentry_cli.server.demo_mode --port 8000 --speed 0 &
          python - <<'PY'
          import json
          import time
          import urllib.request

          for _ in range(50):
              try:
                  with urllib.request.urlopen("http://127.0.0.1:8000/meta", timeout=1) as response:
                      meta = json.load(response)
                  break
              except Exception:
                  time.sleep(0.2)
          else:
              raise SystemExit("demo server did not become healthy")

          assert meta["demoMode"] is True
          with urllib.request.urlopen("http://127.0.0.1:8000/scans", timeout=2) as response:
              scans = json.load(response)["scans"]
          assert len(scans) == 7, len(scans)
          assert {row["verdict"] for row in scans} == {"SAFE", "MALICIOUS"}
          print("demo smoke OK:", len(scans), "skills")
          PY

  python-314:
    # Not supported yet. This job collects evidence for the support decision and never blocks a merge.
    name: Python 3.14 (non-blocking, not yet supported)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Unit + contract tests
        run: pytest tests/unit tests/contract -q

  dashboard:
    name: Dashboard build (Node 24)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: ui/.nvmrc
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install
        working-directory: ui
        run: npm ci

      - name: Type check and build
        working-directory: ui
        run: npm run build

  # Native platform jobs.  Non-blocking for now: the first runs show which tests assume
  # POSIX paths.  Make them required checks once they have been green for a few runs.
  windows:
    name: Windows (unit tests + install.ps1)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Unit + contract tests
        run: pytest tests/unit tests/contract -q

      - name: Build the wheel and check install.ps1 parses
        shell: pwsh
        run: |
          python -m pip wheel . --no-deps -w dist
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("install.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }

      - name: install.ps1 installs the wheel and uninstalls it
        shell: powershell
        run: |
          $wheel = (Get-ChildItem dist\*.whl | Select-Object -First 1).FullName
          powershell -ExecutionPolicy Bypass -File install.ps1 -DryRun -Wheel $wheel
          powershell -ExecutionPolicy Bypass -File install.ps1 -Wheel $wheel -NoSetup
          $env:Path = "$env:USERPROFILE\.local\bin;$env:LOCALAPPDATA\skill-sentry-cli\venv\Scripts;$env:Path"
          skill-sentry-cli --version
          powershell -ExecutionPolicy Bypass -File install.ps1 -Uninstall
          if (Test-Path "$env:LOCALAPPDATA\skill-sentry-cli\venv") { exit 1 }

  macos:
    name: macOS (unit tests + install.sh)
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Unit + contract tests
        run: pytest tests/unit tests/contract -q

      - name: install.sh installs the wheel and uninstalls it
        run: |
          python -m pip wheel . --no-deps -w dist
          sh install.sh --dry-run --wheel dist/*.whl
          sh install.sh --wheel dist/*.whl --no-setup
          # pipx (preinstalled here) puts the command in ~/.local/bin; the private venv does too.
          PATH="$HOME/.local/bin:$PATH" skill-sentry-cli --version
          sh install.sh --uninstall

  installers:
    name: Installer scripts (shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: shellcheck install.sh
        run: shellcheck --shell=sh install.sh

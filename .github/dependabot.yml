version: 2
updates:
  # Minor and patch updates arrive as one pull request per ecosystem, so they can be
  # reviewed together. Major updates arrive individually unless they are ignored below.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      python-minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/ui"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      ui-minor-and-patch:
        update-types: ["minor", "patch"]
    # React 19 and TypeScript 7 need a dedicated upgrade: the dashboard must move with
    # them. Tracked in an issue labelled "help wanted".
    ignore:
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # The sandbox image's hash-locked Pillow requirement lives beside its Dockerfile.
  - package-ecosystem: "pip"
    directory: "/skill_sentry_cli/core/sandbox/assets"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions-minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    # Node 25 is not an LTS release; the project stays on the current LTS line.
    # The server image runs the Python versions the project supports (3.11 to 3.13),
    # so moves to a newer Python are made deliberately, not by this bot.
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  # The sandbox image is built from its own Dockerfile (python:3.11-slim, pinned by digest).
  # It keeps the same policy as the server image: the 3.11 line stays put, and only the
  # base image's patch level and digest move.
  - package-ecosystem: "docker"
    directory: "/skill_sentry_cli/core/sandbox/assets"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

name: Feature request
description: Suggest a detection, a report format, a command, or an improvement.
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Before you start, read the [Verdict contract](https://github.com/EmberPhantom/SkillSentry/blob/main/docs/reference/api.md) and the [Ground Rules in CONTRIBUTING.md](https://github.com/EmberPhantom/SkillSentry/blob/main/CONTRIBUTING.md#ground-rules). The Verdict JSON contract is frozen; changes must be additive.
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the situation, not only the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Detection (anchors, semantic, vision, sandbox, evasion)
        - Poisoned Well (canaries, exfiltration tracking, IOCs)
        - CLI
        - Reports (SARIF, Markdown, JSON, STIX)
        - Dashboard (UI)
        - Installers and packaging
        - Documentation
        - Other
    validations:
      required: true
  - type: checkboxes
    id: contract
    attributes:
      label: Compatibility
      options:
        - label: This change keeps the frozen Verdict JSON contract backward compatible (new optional fields only), or it is not a contract change.
        - label: I understand that changes to fusion weights, prompts, anchors, or the stage list need a full fixture re-run and maintainer sign-off.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered

version = 2

[sources]
env_name_patterns = [
    "(?i)(token|secret|password|passwd|api[_-]?key|access[_-]?key|credential|private[_-]?key)"
]
path_globs = [
    "~/.aws/*",
    "~/.ssh/*",
    "~/.config/gcloud/*",
    "~/.netrc",
    "~/.docker/config.json",
    "~/.npmrc",
    "~/.pypirc",
    "~/.kube/config",
    "**/.env",
    "~/.git-credentials"
]

[sinks]
python_calls = [
    "requests.post",
    "requests.put",
    "requests.patch",
    "requests.get",
    "requests.request",
    "httpx.post",
    "httpx.put",
    "httpx.get",
    "httpx.request",
    "urllib.request.urlopen",
    "urllib.request.Request",
    "http.client.HTTPSConnection",
    "http.client.HTTPConnection",
    "socket.gethostbyname",
    "socket.getaddrinfo",
    "socket.create_connection"
]
js_patterns = [
    "fetch\\(",
    "axios\\.",
    "XMLHttpRequest",
    "https?\\.request\\("
]
shell_patterns = [
    "curl\\s",
    "wget\\s",
    "nc\\s",
    "dig\\s",
    "nslookup\\s"
]


# Service bindings (feature/developer-2): a credential belongs to the vendor behind its hosts.
[[service_bindings]]
name = "github"
credential_env = ["(?i)^(GITHUB|GH)_(TOKEN|PAT)$"]
hosts = ["github.com", "githubusercontent.com"]

[[service_bindings]]
name = "slack"
credential_env = ["(?i)^SLACK_.*(TOKEN|WEBHOOK|SECRET|URL)$"]
hosts = ["slack.com"]

[[service_bindings]]
name = "aws"
credential_env = ["(?i)^AWS_.*"]
credential_paths = ["~/.aws/*"]
hosts = ["amazonaws.com"]

[[service_bindings]]
name = "openai"
credential_env = ["(?i)^OPENAI_API_KEY$"]
hosts = ["openai.com"]

[[service_bindings]]
name = "anthropic"
credential_env = ["(?i)^ANTHROPIC_API_KEY$"]
hosts = ["anthropic.com"]

[[service_bindings]]
name = "gitlab"
credential_env = ["(?i)^GITLAB_.*(TOKEN|PAT)$"]
hosts = ["gitlab.com"]

[[service_bindings]]
name = "pypi"
credential_env = ["(?i)^(PYPI_TOKEN|TWINE_PASSWORD)$"]
hosts = ["pypi.org"]

[[service_bindings]]
name = "npm"
credential_env = ["(?i)^NPM_TOKEN$"]
hosts = ["npmjs.org", "npmjs.com"]

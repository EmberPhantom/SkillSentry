[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "skill-sentry-cli"
dynamic = ["version"]
description = "A context-aware firewall for the agent skill supply chain with Poisoned Well active defense."
readme = "packaging/PYPI_README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
license-files = ["LICENSE"]
authors = [{ name = "Team SkillSentry" }]
keywords = ["security", "agent-skills", "supply-chain", "sandbox", "local-llm"]

classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: POSIX :: Linux",
  "Topic :: Security",
]
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.9,<3.0",
  "httpx>=0.27,<1.0",
  "typer>=0.16,<1.0",
  "rich>=13.7,<15.0",
  "docker>=7.0,<8.0",
  "watchdog>=4.0,<7.0",
  "python-frontmatter>=1.1,<2.0",
  "PyYAML>=6.0.1,<7.0",
  "Jinja2>=3.1,<4.0",
  "Pillow>=10.0,<13.0",
]

[project.urls]
Homepage = "https://github.com/EmberPhantom/SkillSentry"
Source = "https://github.com/EmberPhantom/SkillSentry"
Issues = "https://github.com/EmberPhantom/SkillSentry/issues"
Changelog = "https://github.com/EmberPhantom/SkillSentry/blob/main/docs/CHANGELOG.md"

[project.optional-dependencies]
laya = [
  # Laya already declares torch, transformers, safetensors, and huggingface_hub.
  # Keep the extra to the decision package so the base install stays lightweight.
  "laya>=0.4.17,<0.5",
]
dev = [
  "pytest>=8.2,<9.0",
  "pytest-asyncio>=0.23,<2.0",
  "pytest-cov>=5.0,<8.0",
  "respx>=0.21,<1.0",
  "hypothesis>=6.100,<7.0",
  "jsonschema>=4.22,<5.0",
  "ruff>=0.6,<1.0",
  "mypy>=1.11,<2.0",
  "types-PyYAML>=6.0,<7.0",
]

[project.scripts]
skill-sentry-cli = "skill_sentry_cli.cli:app"

[tool.hatch.version]
path = "skill_sentry_cli/core/version.py"

[tool.hatch.build.targets.wheel]
packages = ["skill_sentry_cli"]
# The dashboard is built into skill_sentry_cli/ui/dist and is gitignored, so it must be listed
# explicitly or the wheel would omit it.
artifacts = ["skill_sentry_cli/ui/dist/**"]

[tool.hatch.build.targets.sdist]
include = [
  "skill_sentry_cli",
  "docs",
  "README.md",
  "packaging",
  "LICENSE",
  "SECURITY.md",
  "CONTRIBUTING.md",
]

# The dashboard build is git-ignored; the sdist must carry it so a wheel built from the sdist serves the dashboard.
[tool.hatch.build.targets.sdist.force-include]
"skill_sentry_cli/ui/dist" = "skill_sentry_cli/ui/dist"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["skill_sentry_cli", "tests"]
extend-exclude = ["tests/fixtures/decisions/cases"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
  "B008",   # Typer uses function calls in argument defaults
  "E501",   # line length is enforced by `ruff format`; long strings cannot wrap
  "RUF001", # ambiguous unicode in docstrings (emoji are intentional)
  "UP042",  # str+Enum is intentional: stable JSON values across model layers
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"
markers = [
  "fake_transport: tests using httpx.MockTransport rather than a live service",
  "live_ollama: end-to-end test against a live Ollama server (skips when none is reachable)",
]
filterwarnings = [
  "error::DeprecationWarning:skill_sentry_cli.*",
]

[tool.coverage.run]
source = ["skill_sentry_cli"]

[tool.coverage.report]
# Measured at 88% when the gate was added; the floor sits 2 points below so it only fails on a real drop.
fail_under = 86
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.11"
files = ["skill_sentry_cli"]
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
check_untyped_defs = false

[[tool.mypy.overrides]]
module = ["docker", "docker.*"]
ignore_missing_imports = true

# Lenient modules: each reports annotation clashes, not runtime defects (a variable reused
# for two shapes in different branches, or a protocol narrower than its implementation).
# They are the first targets for tightening; remove a module from this list once it is clean.
[[tool.mypy.overrides]]
module = [
  "skill_sentry_cli.core.decisions.selector",
  "skill_sentry_cli.core.decisions.mock",
  "skill_sentry_cli.core.decisions.laya",
  "skill_sentry_cli.core.models.selector",
  "skill_sentry_cli.core.models.gemma_cloud",
  "skill_sentry_cli.core.parser.skill_parser",
  "skill_sentry_cli.core.cache.sqlite_store",
]
ignore_errors = true

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "skillsentry"
version = "2.0.0"
description = "A context-aware firewall for the agent skill supply chain with Poisoned Well active defense."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Team SkillSentry" }]
keywords = ["security", "agent-skills", "supply-chain", "sandbox", "gemma"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
]
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.9,<3.0",
  "httpx>=0.27,<1.0",
  "typer>=0.12,<1.0",
  "rich>=13.7,<15.0",
  "docker>=7.0,<8.0",
  "watchdog>=4.0,<7.0",
  "python-frontmatter>=1.1,<2.0",
  "PyYAML>=6.0,<7.0",
  "Jinja2>=3.1,<4.0",
  "Pillow>=10.0,<13.0",
  "defusedxml>=0.7.1",
]

[project.optional-dependencies]
laya = [
  # Laya already declares torch, transformers, safetensors, and huggingface_hub.
  # Keep the extra to the decision package so the base install stays lightweight.
  "laya>=0.4.17,<0.5",
]
dev = [
  "pytest>=8.2,<9.0",
  "pytest-asyncio>=0.23,<2.0",
  "pytest-cov>=5.0,<8.0",
  "respx>=0.21,<1.0",
  "hypothesis>=6.100,<7.0",
  "jsonschema>=4.22,<5.0",
  "ruff>=0.6,<1.0",
]

[project.scripts]
skillsentry = "skillsentry.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["skillsentry"]

[tool.hatch.build.targets.sdist]
include = [
  "skillsentry",
  "docs",
  "README.md",
  "LICENSE",
  "SECURITY.md",
  "CONTRIBUTING.md",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["skillsentry", "tests"]
extend-exclude = ["tests/fixtures/decisions/cases"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
  "B008",   # Typer uses function calls in argument defaults
  "E501",   # line length is enforced by `ruff format`; long strings cannot wrap
  "RUF001", # ambiguous unicode in docstrings (emoji are intentional)
  "UP042",  # str+Enum is intentional: stable JSON values across model layers
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "fake_transport: tests using httpx.MockTransport rather than live service",
  "live_ollama: end-to-end test against a live Ollama server",
]
asyncio_mode = "auto"
addopts = "-ra"
filterwarnings = [
  "error::DeprecationWarning:skillsentry.*",
]

[tool.coverage.run]
source = ["skillsentry"]
